<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jedi Outcast · Atom X Eve</title>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <link rel="stylesheet" href="./launcher.css?runtime=fixed-1024x768-v8">
</head>
<body>
  <div id="wrap">
    <canvas id="canvas" width="1024" height="768" tabindex="0" aria-label="Jedi Outcast game" oncontextmenu="event.preventDefault()"></canvas>
  </div>

  <div id="load" class="indet" role="status" aria-live="polite">
    <div class="ld-inner">
      <div class="ld-title">Jedi Outcast</div>
      <div class="ld-status" id="ld-status">Connecting original game data…</div>
      <div class="ld-bar"><div class="ld-fill" id="ld-fill"></div></div>
      <div class="ld-detail" id="ld-detail">Reading the canonical GameData registered in Atom XE.</div>
      <div class="ld-credit">Raven Software engine · Atom XE canonical source bridge</div>
    </div>
  </div>

  <section id="runtime-error" role="alert" hidden>
    <h2>The game could not continue</h2>
    <p id="runtime-error-detail"></p>
    <button type="button" id="reload-game">Reload Jedi Outcast</button>
  </section>

  <script src="./engine-shell.js?runtime=fixed-1024x768-v8"></script>
  <script type="module" src="./atom-launcher.mjs?runtime=fixed-1024x768-v8"></script>
</body>
</html>
