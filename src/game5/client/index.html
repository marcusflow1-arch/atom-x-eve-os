<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Game 5 — Retrieve the Lost Card (Development Only)</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08121b;color:#f3ede1;font-family:system-ui,-apple-system,Segoe UI,sans-serif}canvas{display:block}#game{position:absolute;inset:0}#hud{position:absolute;top:22px;left:22px;background:rgba(13,25,32,.88);border:1px solid #56746e;padding:18px 20px;border-radius:12px;min-width:290px;pointer-events:none;backdrop-filter:blur(10px)}#hud .label{font-size:11px;letter-spacing:.16em;color:#accdc1}h1{font-size:18px;font-weight:600;margin:8px 0}#objective{color:#e8d3a0;font-size:14px;margin-top:10px}#wallet{margin-top:12px;font-size:12px;color:#91b8ae}#help{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:rgba(10,20,28,.82);border:1px solid #476f67;border-radius:10px;padding:10px 16px;font-size:13px;text-align:center;white-space:nowrap}#notification{position:absolute;top:22px;right:22px;max-width:340px;padding:12px 16px;border-radius:10px;background:rgba(22,58,49,.94);border:1px solid #72c2aa;display:none}#notification.error{background:rgba(82,29,29,.94);border-color:#e79a9a}#marker{position:absolute;pointer-events:none;font-size:30px;font-weight:bold;color:#f5d17d;text-shadow:0 0 14px #ffdd88;transform:translate(-50%,-90%)}#dialogue{position:absolute;inset:0;background:rgba(4,12,17,.6);display:none;align-items:center;justify-content:center}#panel{width:min(480px,92vw);padding:25px;background:linear-gradient(145deg,#203833,#111e28);border:1px solid #c9b478;border-radius:16px;box-shadow:0 14px 70px #0009}#panel h2{margin-top:0;color:#e8cf8d}#panel p{line-height:1.65}button{border:1px solid #b79e66;border-radius:8px;background:#345449;color:white;font-size:15px;padding:11px 20px;cursor:pointer;margin-right:8px}button:disabled{opacity:.45;cursor:default}button.secondary{background:transparent;border-color:#7b948a}#dev{position:absolute;bottom:12px;right:16px;color:#d5ad85;font-size:11px;pointer-events:none}
</style></head><body>
<div id="game"></div><div id="hud"><div class="label">GAME 5 · WUXIA QUEST PROTOTYPE</div><h1 id="questTitle">Retrieve the Lost Card</h1><div id="objective">Connecting…</div><div id="wallet">Test tokens: 0</div></div><div id="marker">!</div>
<div id="notification" role="status" aria-live="polite"></div><div id="help">WASD / Arrow keys: move · Shift: run · E: interact</div><div id="dev">LOCAL DEVELOPMENT ONLY · simulated position &amp; inventory · no production rewards</div>
<div id="dialogue" role="dialog" aria-modal="true" aria-labelledby="npcTitle"><div id="panel"><div class="label">QUEST GIVER</div><h2 id="npcTitle">Elder Shen</h2><p id="dialogText"></p><button id="actionBtn">Accept quest</button><button id="closeBtn" class="secondary">Close</button></div></div>
<script type="module" src="./main.js"></script></body></html>
