name: Apply Luna dashboard messages

on:
  push:
    branches:
      - feature/modernized-twelvesky-systems
    paths:
      - .github/workflows/apply-luna-dashboard-messages.yml

permissions:
  contents: write

jobs:
  patch-luna:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/modernized-twelvesky-systems
          fetch-depth: 0

      - name: Patch LunaTemplate to own Messages directly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          luna = Path('src/pages/LunaTemplate.jsx')
          text = luna.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "import WhatsNewSection from '../components/dashboard/WhatsNewSection';\nimport { useSidebarVisible } from '../hooks/useSidebarVisible';",
              "import WhatsNewSection from '../components/dashboard/WhatsNewSection';\nimport LunaMessageCenter from '../components/dashboard/LunaMessageCenter';\nimport { useSidebarVisible } from '../hooks/useSidebarVisible';",
              'LunaMessageCenter import',
          )

          replace_once(
              "  const [selectedFriend, setSelectedFriend] = useState(null);\n  const [showCalendar, setShowCalendar] = useState(false);",
              "  const [selectedFriend, setSelectedFriend] = useState(null);\n  const [showMessages, setShowMessages] = useState(false);\n  const [messageFriend, setMessageFriend] = useState(null);\n  const [showCalendar, setShowCalendar] = useState(false);",
              'message state',
          )

          replace_once(
              "  useEffect(() => {\n    const handleSkillTree = () => setShowSkillTreeBlankUI((prev) => !prev);\n    window.addEventListener('toggleSkillTree', handleSkillTree);\n    return () => window.removeEventListener('toggleSkillTree', handleSkillTree);\n  }, []);\n\n  // Hardcoded assets for System Reboot",
              "  useEffect(() => {\n    const handleSkillTree = () => setShowSkillTreeBlankUI((prev) => !prev);\n    window.addEventListener('toggleSkillTree', handleSkillTree);\n    return () => window.removeEventListener('toggleSkillTree', handleSkillTree);\n  }, []);\n\n  // Luna owns the messaging surface directly. Friend presence slots, the\n  // Friends network, and profile Message actions all route through this event.\n  useEffect(() => {\n    const openMessages = (event) => {\n      setMessageFriend(event?.detail?.friend || null);\n      setShowMessages(true);\n    };\n    window.addEventListener('openLunaMessages', openMessages);\n    return () => window.removeEventListener('openLunaMessages', openMessages);\n  }, []);\n\n  // Hardcoded assets for System Reboot",
              'message event ownership',
          )

          replace_once(
              "      if (key === 'escape') {\n        if (showFriendsHub) { setShowFriendsHub(false); return; }",
              "      if (key === 'escape') {\n        if (showMessages) { setShowMessages(false); setMessageFriend(null); return; }\n        if (showFriendsHub) { setShowFriendsHub(false); return; }",
              'escape behavior',
          )

          replace_once(
              "  }, [showForumOverlay, showAvatarProgression, navigate, showLibraryLanding, librarySelection, showDevSpotlight, hideUI, selectedFocusGame, longPressGame, showFriendsHub]);",
              "  }, [showForumOverlay, showAvatarProgression, navigate, showLibraryLanding, librarySelection, showDevSpotlight, hideUI, selectedFocusGame, longPressGame, showFriendsHub, showMessages]);",
              'escape dependencies',
          )

          replace_once(
              "              {/* Friends (Replaces Skill Tree) */}\n              <ConsoleTile\n                          onClick={() => setStageMode((m) => m === 'friends' ? 'default' : 'friends')}\n                          className={`flex-1 h-28 cursor-pointer flex flex-col items-center justify-center gap-2 ${stageMode === 'friends' ? 'border-green-400/50 bg-green-900/20' : ''}`}>",
              "              {/* Friends / Messages */}\n              <ConsoleTile\n                          onClick={() => {\n                            setMessageFriend(null);\n                            setShowMessages(true);\n                            setStageMode('default');\n                          }}\n                          className={`flex-1 h-28 cursor-pointer flex flex-col items-center justify-center gap-2 ${showMessages ? 'border-green-400/50 bg-green-900/20' : ''}`}>",
              'Friends tile action',
          )

          replace_once(
              "                <Users className={`w-10 h-10 relative z-10 ${stageMode === 'friends' ? 'text-green-400' : ''}`} style={stageMode === 'friends' ? {} : { stroke: 'url(#silverGradient)', filter: 'drop-shadow(0px 0px 8px rgba(255, 255, 255, 0.4))' }} strokeWidth={1.5} />\n                <span className={`text-sm font-sans relative z-10 ${stageMode === 'friends' ? 'text-green-400 font-bold' : 'text-[#CCCCCC]'}`} style={{ textShadow: '0 2px 4px rgba(0,0,0,0.8)' }}>Friends</span>",
              "                <Users className={`w-10 h-10 relative z-10 ${showMessages ? 'text-green-400' : ''}`} style={showMessages ? {} : { stroke: 'url(#silverGradient)', filter: 'drop-shadow(0px 0px 8px rgba(255, 255, 255, 0.4))' }} strokeWidth={1.5} />\n                <span className={`text-sm font-sans relative z-10 ${showMessages ? 'text-green-400 font-bold' : 'text-[#CCCCCC]'}`} style={{ textShadow: '0 2px 4px rgba(0,0,0,0.8)' }}>Friends</span>",
              'Friends tile active state',
          )

          replace_once(
              "      {/* Side Access Menu - hidden when sidebar is hidden */}",
              "      {/* Luna Messages — center-page, borderless blurred social surface */}\n      <LunaMessageCenter\n        open={showMessages}\n        initialFriend={messageFriend}\n        onClose={() => {\n          setShowMessages(false);\n          setMessageFriend(null);\n        }}\n        onRequestOpen={(friend) => {\n          setMessageFriend(friend || null);\n          setShowMessages(true);\n        }}\n      />\n\n      {/* Side Access Menu - hidden when sidebar is hidden */}",
              'LunaMessageCenter render',
          )

          luna.write_text(text)

          console_tiles = Path('src/components/dashboard/ConsoleTiles.jsx')
          ct = console_tiles.read_text()
          old = """  const isFriendsTile = useMemo(() => {\n    const label = collectChildText(children).replace(/\\s+/g, ' ').trim().toLowerCase();\n    return label === 'friends' || label.endsWith(' friends') || label.startsWith('friends ');\n  }, [children]);"""
          if old not in ct:
              raise SystemExit('ConsoleTiles temporary Friends host marker not found')
          ct = ct.replace(old, "  // LunaTemplate now owns Messages directly; keep ConsoleTile presentation-only.\n  const isFriendsTile = false;", 1)
          console_tiles.write_text(ct)
          PY

      - name: Verify Luna page owns the feature
        shell: bash
        run: |
          grep -n "LunaMessageCenter" src/pages/LunaTemplate.jsx
          grep -n "showMessages" src/pages/LunaTemplate.jsx
          grep -n "openLunaMessages" src/pages/LunaTemplate.jsx

      - name: Commit Luna dashboard integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/LunaTemplate.jsx src/components/dashboard/ConsoleTiles.jsx
          git commit -m "Apply Messages directly to Luna dashboard page"
          git push origin HEAD:feature/modernized-twelvesky-systems
