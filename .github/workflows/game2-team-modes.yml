name: Game Two team-mode tests

on:
  push:
    branches:
      - feature/game2-drive-two-maps-ctf-sudden8v8
  pull_request:
    paths:
      - 'src/components/game2/**'
      - 'tests/game2-team-modes.test.mjs'
      - '.github/workflows/game2-team-modes.yml'

jobs:
  game2-team-modes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify Game Two match rules
        run: node --test tests/game2-team-modes.test.mjs
