name: Atom x Eve Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Card System v2 invariants
        run: node tests/card-system-v2.test.mjs
      - name: Validate Card System v2 UI
        run: |
          node tests/card-system-v2-ui.test.mjs
          node tests/card-system-v2-market-ui.test.mjs
          node tests/card-system-v2-skillbook-ui.test.mjs
          node tests/card-system-v2-trading-post-ui.test.mjs
      - name: Validate Skill Book and card-combat integration
        run: |
          node tests/skill-book-eligibility-ui.test.mjs
          node tests/skill-book-avatar-refresh.test.mjs
          node tests/avatar-combat-stats.test.mjs
      - name: Build application
        run: npm run build
      - name: Check for accidentally committed payment credentials
        shell: bash
        run: |
          if grep -RniE "(sk_live_[A-Za-z0-9]+|-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----|paypal.*(secret|password)[[:space:]]*[:=][[:space:]]*['\"][^'\"]+['\"])" src base44 --exclude-dir=node_modules --exclude='*.map' 2>/dev/null; then
            echo "Potential hardcoded secret or private credential found in source tree."
            exit 1
          fi
