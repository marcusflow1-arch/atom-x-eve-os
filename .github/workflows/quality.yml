name: Atom x Eve Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Verify shared gamer profile and game-shelf interactions
        run: node --test tests/gamer-profile-shelf.test.mjs
      - name: Verify AI Attribute profile icon receives clicks and opens your popup
        run: node tests/dashboard-quick-windows.test.mjs
      - name: Verify Luna Friends Profile and Trade menus
        run: node --test tests/luna-friends-actions.test.mjs
      - name: Run Jedi Outcast loader tests
        run: node --test tests/jedi-original-data.test.mjs tests/jedi-launcher.test.mjs tests/jedi-camera-contract.test.mjs
      - name: Verify Game 2 shared arena multiplayer networking
        run: node --test tests/game2-online.test.mjs tests/game2-arena-coordinator.test.mjs tests/game2-remote-smoothing.test.mjs
      - name: Install Game 2 Railway server dependencies
        run: npm ci --prefix server/game2
      - name: Test Game 2 Railway two-client realtime combat
        run: npm test --prefix server/game2
      - name: Check for accidentally committed payment credentials
        shell: bash
        run: |
          if grep -RniE "(sk_live_[A-Za-z0-9]+|-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----|paypal.*(secret|password)[[:space:]]*[:=][[:space:]]*['\"][^'\"]+['\"])" src base44 --exclude-dir=node_modules --exclude='*.map' 2>/dev/null; then
            echo "Potential hardcoded secret or private credential found in source tree."
            exit 1
          fi
